version: 2
updates:
  # Root library module
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"

  # Examples module (separate go.mod)
  - package-ecosystem: gomod
    directory: /examples/ietf
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-actions:
        patterns:
          - "*"
