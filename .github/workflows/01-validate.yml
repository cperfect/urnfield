name: 01 Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files have formatting issues:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
