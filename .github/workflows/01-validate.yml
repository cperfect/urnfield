name: 01 Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files have formatting issues:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test examples
        working-directory: examples/ietf
        run: go test ./...
