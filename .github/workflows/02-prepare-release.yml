name: 02 Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Pass the dispatch input through the environment so it is never
      # interpolated into shell source (avoids script injection); reference it
      # as the quoted "$VERSION" in run steps.
      VERSION: ${{ inputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -qE '^v2\.[0-9]+\.[0-9]+(-[a-zA-Z0-9.]+)?$'; then
            echo "Version '$VERSION' is not valid — expected a v2 release matching the /v2 module path, e.g. v2.0.0"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "$VERSION"; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

      - name: Format
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files have formatting issues:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test examples
        working-directory: examples/ietf
        run: go test ./...

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ inputs.version }} --output CHANGELOG.md

      - name: Update examples/ietf module version
        run: |
          sed -i "s|github.com/cperfect/urnfield/v2 v[^ ]*|github.com/cperfect/urnfield/v2 $VERSION|" examples/ietf/go.mod

      - name: Tidy examples module
        working-directory: examples/ietf
        run: go mod tidy

      - name: Commit and push release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md examples/ietf/go.mod examples/ietf/go.sum
          git diff --cached --quiet || git commit -m "chore(release): prepare $VERSION"
          git push origin HEAD
