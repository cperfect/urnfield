[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}\

### ⚠ Breaking Changes

{% for commit in breaking %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking_description %} — {{ commit.breaking_description | trim | replace(from="\n", to=" ") }}{% endif %}
{% endfor %}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\

### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.breaking %}**[BREAKING]** {% endif %}{% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% if commit.breaking %}  {{ commit.breaking_description | trim | replace(from="\n", to=" ") }}
{% endif %}\
{% endfor %}\
{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^ci", group = "Continuous Integration" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^chore", group = "Maintenance" },
  { message = "^Merge", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
